<f:layout name="Review" />
<f:section name="Content">
    <h1>{labels.entry_title}</h1>
    <p>{labels.entry_intro}</p>
    <f:if condition="{message}">
        <p class="message message-error" role="alert" id="review-message">{message}</p>
    </f:if>
    <form method="post" action="{enterPath}" autocomplete="off" class="stack">
        <input type="hidden" name="form_token" value="{formToken}">
        <label for="review-token">{labels.entry_token}</label>
        <input type="text" id="review-token" name="token" required spellcheck="false" autocapitalize="none" autocorrect="off" autocomplete="off" aria-describedby="review-token-help">
        <p class="help" id="review-token-help">{labels.entry_noscript}</p>
        <label for="review-passphrase">{labels.entry_passphrase}</label>
        <input type="password" id="review-passphrase" name="passphrase" autocomplete="off">
        <label for="review-name">{labels.entry_name}</label>
        <input type="text" id="review-name" name="name" maxlength="80" value="{name}" autocomplete="name">
        <button type="submit">{labels.entry_submit}</button>
    </form>
    <script src="{entryScriptUrl}" defer></script>
</f:section>

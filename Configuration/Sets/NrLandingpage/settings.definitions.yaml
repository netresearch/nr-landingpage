categories:
  nr_landingpage:
    label: 'Landing Page Generator'
  nr_landingpage.colors:
    label: 'Default Color Scheme'
    parent: nr_landingpage
  nr_landingpage.aiLabel:
    label: 'AI Notice'
    parent: nr_landingpage

settings:
  nr_landingpage.colorPrimary:
    label: 'Primary Color'
    description: >
      Main brand color used for buttons, links, and call-to-action
      elements. Templates inherit this color unless overridden.
    type: color
    default: '#0062a3'
    category: nr_landingpage.colors

  nr_landingpage.colorSecondary:
    label: 'Secondary Color'
    description: >
      Accent color for highlights, hover states, and decorative
      elements. Templates inherit this color unless overridden.
    type: color
    default: '#ff8700'
    category: nr_landingpage.colors

  nr_landingpage.colorBackground:
    label: 'Background Color'
    description: >
      Default page and section background color. Templates inherit
      this color unless overridden.
    type: color
    default: '#ffffff'
    category: nr_landingpage.colors

  nr_landingpage.colorText:
    label: 'Text Color'
    description: >
      Default color for body text and paragraphs. Templates inherit
      this color unless overridden.
    type: color
    default: '#333333'
    category: nr_landingpage.colors

  nr_landingpage.aiLabel.enabled:
    label: 'Show an AI notice on generated pages'
    description: >
      Adds a visible notice at the end of every landing page this extension
      generated. Off by default, because what a site says about itself is the
      site's decision.
    type: bool
    default: false
    category: nr_landingpage.aiLabel

  nr_landingpage.aiLabel.text:
    label: 'Text of the AI notice'
    description: >
      Leave empty for the built-in English or German text, chosen by the
      language of the page.
    type: string
    default: ''
    category: nr_landingpage.aiLabel

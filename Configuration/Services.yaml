services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Netresearch\NrLandingpage\:
    resource: '../Classes/*'

  Netresearch\NrLandingpage\Controller\Backend\LandingPageWizardController:
    public: true

  Netresearch\NrLandingpage\Service\TemplateService:
    public: true

  Netresearch\NrLandingpage\Service\BriefingService:
    public: true

  Netresearch\NrLandingpage\Service\ContentGeneratorService:
    public: true

  Netresearch\NrLandingpage\Service\ImageSearchService:
    public: true

  Netresearch\NrLandingpage\Service\ImageProviderService:
    public: true
    configurator: ['@Netresearch\NrLandingpage\Service\ImageGeneratorRegistrar', 'register']

  Netresearch\NrLandingpage\Service\PageCreatorService:
    public: true

  Netresearch\NrLandingpage\Service\LandingPageDetectionService:
    public: true

  Netresearch\NrLandingpage\Service\PromptOptimizerService:
    public: true

  # Takes nr-llm's GuardrailHintCollector from the container: a new instance
  # would not be the one nr-llm's guardrail middleware records into.
  Netresearch\NrLandingpage\Service\GuardrailHintCapture:
    public: true
    arguments:
      $container: '@service_container'

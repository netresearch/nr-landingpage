services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Netresearch\NrLandingpage\:
    resource: '../Classes/*'

  Netresearch\NrLandingpage\Controller\Backend\LandingPageWizardController:
    public: true

  Netresearch\NrLandingpage\Controller\Backend\WorkspaceController:
    public: true

  Netresearch\NrLandingpage\Controller\Backend\WorkspaceAjaxController:
    public: true

  Netresearch\NrLandingpage\Service\TemplateService:
    public: true

  Netresearch\NrLandingpage\Service\BriefingService:
    public: true

  Netresearch\NrLandingpage\Service\ContentGeneratorService:
    public: true

  Netresearch\NrLandingpage\Service\ImageSearchService:
    public: true

  Netresearch\NrLandingpage\Service\ImageProviderService:
    public: true
    configurator: ['@Netresearch\NrLandingpage\Service\ImageGeneratorRegistrar', 'register']

  Netresearch\NrLandingpage\Service\PageCreatorService:
    public: true

  Netresearch\NrLandingpage\Service\SectionNormalizer:
    public: true

  Netresearch\NrLandingpage\Service\Workspace\DraftRepository:
    public: true

  Netresearch\NrLandingpage\Service\Workspace\ShareLinkRepository:
    public: true

  Netresearch\NrLandingpage\Service\Workspace\AuditRepository:
    public: true

  Netresearch\NrLandingpage\Service\Workspace\DraftAccessGuard:
    public: true

  Netresearch\NrLandingpage\Service\Workspace\DraftService:
    public: true

  Netresearch\NrLandingpage\Service\Workspace\ShareLinkService:
    public: true

  Netresearch\NrLandingpage\Service\Workspace\WorkspaceSettings:
    public: true

  Netresearch\NrLandingpage\Service\LandingPageDetectionService:
    public: true

  Netresearch\NrLandingpage\Service\PromptOptimizerService:
    public: true

  # Takes nr-llm's GuardrailHintCollector from the container: a new instance
  # would not be the one nr-llm's guardrail middleware records into.
  Netresearch\NrLandingpage\Service\GuardrailHintCapture:
    public: true
    arguments:
      $container: '@service_container'

  # The three limiters of the review page keep their state in TYPO3's caching
  # framework, like nr-llm's A2A authenticator.
  Netresearch\NrLandingpage\Service\Workspace\Review\ReviewRateLimits:
    arguments:
      $storage: '@TYPO3\CMS\Core\RateLimiter\Storage\CachingFrameworkStorage'

  Netresearch\NrLandingpage\Controller\Frontend\ReviewController:
    public: true

  Netresearch\NrLandingpage\Middleware\ReviewPageMiddleware:
    public: true

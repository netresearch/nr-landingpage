name: CI

on: [push, pull_request]

permissions: {}

jobs:
  tests:
    uses: netresearch/typo3-ci-workflows/.github/workflows/ci.yml@main
    permissions:
      contents: read
    with:
      # Matrix identical to the previous inline workflow (fail-fast: false is
      # the reusable's default for every job).
      php-versions: '["8.2", "8.3", "8.4"]'
      typo3-versions: '["^13.4", "^14.0"]'
      php-extensions: mbstring, intl, pdo_sqlite

      # `composer ci:cgl` is already `php-cs-fixer fix --dry-run --diff`, so the
      # auto-detect (which appends `-- --dry-run`) is bypassed to keep the
      # command byte-identical to the previous workflow.
      cgl-command: composer ci:cgl

      # This repo's unit suite is `ci:tests`, which is not one of the names the
      # reusable auto-detects (ci:test:php:unit / ci:tests:unit / …) — without
      # this input the unit suite would be silently skipped.
      unit-test-command: composer ci:tests

      # Functional suite is auto-detected as `composer ci:tests:functional`;
      # sqlite selects the job that exports typo3DatabaseDriver=pdo_sqlite,
      # matching the previous `env:` block.
      run-functional-tests: true
      functional-test-db: sqlite

      # No Rector composer script exists and the previous workflow never ran
      # Rector — keep CI scope unchanged.
      run-rector: false

      # Documentation/guides.xml is already rendered and validated by docs.yml.
      run-docs: false

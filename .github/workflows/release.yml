name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  release:
    uses: netresearch/typo3-ci-workflows/.github/workflows/release.yml@main
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      archive-prefix: nr-landingpage
      package-name: netresearch/nr-landingpage

  # TER publishing is disabled until nr_landingpage is registered on
  # extensions.typo3.org and TYPO3_EXTENSION_KEY / TYPO3_TER_ACCESS_TOKEN
  # secrets are configured. Without the token the reusable workflow hard-fails
  # (exit 255) on every tag push. Re-enable once the extension is on TER.

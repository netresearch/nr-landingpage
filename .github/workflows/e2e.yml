name: E2E

# The Playwright suite covers the wizard end to end with mocked AJAX, and it is
# the only test surface below the PHP layer — this extension has no JavaScript
# unit tests. Until it ran automatically a fix could be reverted without
# anything noticing (#22).
#
# This calls the shared workflow rather than standing TYPO3 up itself (#26).
# The hand-rolled version it replaces had to learn three things the hard way,
# all of which the shared one already knows: actions pinned to a commit SHA,
# `typo3 setup --server-type`, and a router that hands existing files back to
# the built-in server instead of routing the backend's own JavaScript through
# index.php.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    uses: netresearch/typo3-ci-workflows/.github/workflows/e2e.yml@main
    # The reusable workflow declares this scope; a caller that omits it fails at
    # startup before any job runs.
    permissions:
      contents: read
    with:
      php-version: '8.4'
      # The suite drives the real backend and the wizard's iframe, so the report
      # and traces are the only way to see why a run failed.
      artifact-path: |
        playwright-report
        test-results
      # php -S serves one request at a time by default, and a backend page fans
      # out many subresource requests.
      php-server-workers: '4'
